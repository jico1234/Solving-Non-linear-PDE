name: Run Python Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:     

jobs:
  run-script:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy pysr julia

      - name: Execute Script
        run: python solve.py # Change to your file name
